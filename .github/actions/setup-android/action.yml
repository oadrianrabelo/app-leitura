name: Preparar build Android
description: Java, Android SDK/NDK (já presentes no runner), Rust com alvos Android e Node.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"
    - name: Android NDK
      shell: bash
      run: |
        if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
        else
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
        fi
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
