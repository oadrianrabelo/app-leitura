name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Interface (tipos e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  desktop:
    name: Desktop (cargo check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  android:
    name: Android (APK de teste)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-android
      - run: npm ci
      - name: Build do APK
        run: npx tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@v5
        with:
          name: sepia-apk-teste
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
