name: Release

# Publica uma versão nova: ao enviar uma tag vX.Y.Z, ou manualmente (Actions →
# Release → Run workflow), que cria a tag a partir da versão do package.json.
# O app instalado consulta a release mais recente e se atualiza sozinho.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    name: Notas da versão
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Tag enviada: usa ela. Disparo manual: cria a partir da versão do package.json.
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - id: notes
        run: |
          {
            echo "body<<EOF_NOTES"
            node --experimental-strip-types scripts/release-notes.ts
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Dependências do sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          # O token automático não pode criar tags novas; um token pessoal (RELEASE_TOKEN) pode
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Login do Google no desktop (sincronização); vazio = sincronização indisponível no desktop
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        with:
          tagName: ${{ needs.notes.outputs.tag }}
          releaseName: "Sépia ${{ needs.notes.outputs.tag }}"
          releaseCommitish: ${{ github.sha }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Android
    needs: [notes, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-android
      - run: npm ci
      - name: Chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 não configurado"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sepia-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sepia-release.jks" >> "$GITHUB_ENV"
      - name: Build do APK assinado
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: sepia
        run: npx tauri android build --apk --target aarch64 --target armv7
      - name: Anexar à release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.notes.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          cp "$APK" "Sepia_${VERSION}_android.apk"
          gh release upload "$TAG" "Sepia_${VERSION}_android.apk" --clobber
